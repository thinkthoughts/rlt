id: NAT-DEC
authority: interpretation   # selects a reading of notation; proofs come only from the kernel
sources: [PEANO]

# Executable fields: they decide what a written expression elaborates to.
# Pinned in the binary (PINNED_CONVENTIONS, interpretation digest).
executable:
  elaborator: nat-dec
  operators: ["+", "×"]   # × added in RLT-003 M1 (multiplication, binds tighter than +)

# Explanation: prose no check uses to elaborate. Pinned separately
# (PINNED_CONVENTIONS, explanation digest), so a prose edit needs review too.
explanation:
  title: Decimal natural-number arithmetic
  reading:
    - "A run of decimal digits n denotes the numeral S^n(0)."
    - "+ denotes addition on the natural numbers and groups to the left: a + b + c reads (a + b) + c."
    - "× denotes multiplication on the natural numbers (kernel symbol *), binds tighter than + and groups to the left: a × b × c reads (a × b) × c (RLT-003 M1)."
    - "= denotes equality on the natural numbers."
    - "Parentheses group."
  limits:
    - "RLT-001 numerals are unary in the kernel and capped at 1000 (kernel terms are trees; deep unary chains cost stack)."
    - "<, >, ≠, ∧, mod and units are outside NAT-DEC (× was added in RLT-003 M1)."

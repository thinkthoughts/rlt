name: rlt

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The Rust version comes from rust-toolchain.toml (pinned).
      - run: rustup show
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release
      - name: Install Lean (independent replay; lean/lean-toolchain selects the version)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/v4.2.4/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Clone source repositories for the excerpt check
        run: |
          pip install pyyaml
          mkdir -p /tmp/src
          for r in news rlt translatepi antiviolence residue-manifold-learning specification-grammar general-divisor-theorem; do
            git clone -q "https://github.com/thinkthoughts/$r" "/tmp/src/$r"
          done
          # RLT-003 M3b sources: partial clones, read with git show COMMIT:PATH.
          git clone -q --filter=tree:0 --no-checkout https://github.com/OpenLogicProject/OpenLogic /tmp/src/OpenLogic
          git clone -q --filter=tree:0 --no-checkout https://github.com/leanprover/lean4 /tmp/src/lean4
          # RLT-005 archived source: arXiv e-print; check_excerpts.py refuses it
          # unless its SHA-256 equals the registry pin.
          mkdir -p /tmp/src/archived
          curl -fsSL -A "rlt-ci" -o /tmp/src/archived/2604.05304v2 https://export.arxiv.org/e-print/2604.05304v2
      - run: scripts/verify.sh /tmp/src
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: verification/RLT-001-results.txt

  # RLT-003 M2: the GDT comparison, reported on its own with an explicit
  # status (compiled or unverified). It needs Mathlib and is outside the gate
  # above: Lean-checked statements about GDT are not RLT theorems.
  gdt-comparison:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/v4.2.4/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Clone GDT at the pinned commit
        run: |
          git clone -q https://github.com/thinkthoughts/general-divisor-theorem /tmp/gdt
          git -C /tmp/gdt checkout -q ec66260c98eff965bea79891ffbbc0d3229c6e93
      - name: GDT comparison (status line is compiled or unverified)
        shell: bash
        run: |
          set -o pipefail
          scripts/gdt-compare.sh /tmp/gdt | tee gdt-comparison.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gdt-comparison
          path: gdt-comparison.txt

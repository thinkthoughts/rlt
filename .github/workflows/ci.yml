name: rlt

on:
  push:
  pull_request:

jobs:
  check:
    # Pinned: the RLT-006 transcription pins pdftotext 24.02.0 (poppler on
    # Ubuntu 24.04); a newer runner image would ship another version.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The Rust version comes from rust-toolchain.toml (pinned).
      - run: rustup show
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      # PyYAML before cargo test: tests materialize RLT-006's certificates
      # with scripts/gen-rlt006.py, which reads the transcription (YAML).
      - run: pip install pyyaml
      - run: cargo test --release
      - name: Install Lean (independent replay; lean/lean-toolchain selects the version)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/v4.2.4/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Clone source repositories for the excerpt check
        run: |
          pip install pyyaml
          mkdir -p /tmp/src
          for r in news rlt translatepi antiviolence residue-manifold-learning specification-grammar general-divisor-theorem; do
            git clone -q "https://github.com/thinkthoughts/$r" "/tmp/src/$r"
          done
          # RLT-003 M3b sources: partial clones, read with git show COMMIT:PATH.
          git clone -q --filter=tree:0 --no-checkout https://github.com/OpenLogicProject/OpenLogic /tmp/src/OpenLogic
          git clone -q --filter=tree:0 --no-checkout https://github.com/leanprover/lean4 /tmp/src/lean4
          # RLT-005 archived source: arXiv e-print; check_excerpts.py refuses it
          # unless its SHA-256 equals the registry pin.
          mkdir -p /tmp/src/archived
          curl -fsSL -A "rlt-ci" -o /tmp/src/archived/2604.05304v2 https://export.arxiv.org/e-print/2604.05304v2
          # A gzip archive starts with 1f 8b; anything else (an HTML error or
          # rate-limit page) is a failed download, not a tampered source.
          [ "$(head -c 2 /tmp/src/archived/2604.05304v2 | od -An -tx1 | tr -d ' ')" = 1f8b ] || { echo "download failed: export.arxiv.org did not return a gzip archive"; exit 1; }
          # RLT-006 transcribed source: Axiom Math's PDF (pinned by SHA-256 in the
          # registry) and pdftotext (poppler 24.02.0 on ubuntu-24.04, pinned by the
          # transcription); lean-bgp212 for the vendored-block comparison.
          sudo apt-get install -y -qq poppler-utils >/dev/null
          pdftotext -v 2>&1 | head -1
          curl -fsSL -A "rlt-ci" -o /tmp/src/archived/bgp212.pdf https://primegaps.axiommath.ai/bgp212.pdf
          [ "$(head -c 5 /tmp/src/archived/bgp212.pdf)" = "%PDF-" ] || { echo "download failed: primegaps.axiommath.ai did not return a PDF"; exit 1; }
          git clone -q https://github.com/thinkthoughts/lean-bgp212 /tmp/src/lean-bgp212
      - run: scripts/verify.sh /tmp/src
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: verification/RLT-001-results.txt

  # RLT-003 M2: the GDT comparison, reported on its own with an explicit
  # status (compiled or unverified). It needs Mathlib and is outside the gate
  # above: Lean-checked statements about GDT are not RLT theorems.
  gdt-comparison:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/v4.2.4/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Clone GDT at the pinned commit
        run: |
          git clone -q https://github.com/thinkthoughts/general-divisor-theorem /tmp/gdt
          git -C /tmp/gdt checkout -q ec66260c98eff965bea79891ffbbc0d3229c6e93
      - name: GDT comparison (status line is compiled or unverified)
        shell: bash
        run: |
          set -o pipefail
          scripts/gdt-compare.sh /tmp/gdt | tee gdt-comparison.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gdt-comparison
          path: gdt-comparison.txt

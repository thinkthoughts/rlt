name: rlt

on:
  push:
  pull_request:
  # RLT-007a (H3): weekly live re-fetch of every source (non-blocking; it
  # gates nothing and runs no proofs). Routine runs use pinned commits only.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

jobs:
  check:
    if: github.event_name != 'schedule'
    # Pinned: the RLT-006 transcription pins pdftotext 24.02.0 (poppler on
    # Ubuntu 24.04); a newer runner image would ship another version.
    runs-on: ubuntu-24.04
    # Final audit: a hung step fails the job instead of waiting six hours.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # The Rust version comes from rust-toolchain.toml (pinned).
      - run: rustup show
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      # RLT-007a (B3): `cargo test --release` runs once, inside scripts/verify.sh
      # (which fails if any test fails); the separate step ran it twice.
      - name: Install Lean (independent replay; lean/lean-toolchain selects the version)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/v4.2.4/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      # RLT-007a (H3): routine runs read no branch. Every GitHub source is
      # fetched by its pinned commit SHA; the arXiv e-print and the PDF come
      # from a cache keyed by the registry (downloaded only on a cache miss,
      # and refused unless equal to their SHA-256 pins).
      # Final audit: this job only RESTORES the cache; entries are written
      # only by the source-provenance job on main (a trusted ref), never by a
      # pull request or by this job. Whatever is restored is still treated as
      # untrusted: fetch-sources.py keeps only plain object files and re-hashes
      # them, and every read re-hashes the objects on its path.
      - name: Restore pinned sources (read-only cache)
        uses: actions/cache/restore@v4
        with:
          path: /tmp/src
          key: rlt-sources-${{ hashFiles('sources/registry.yaml', 'sources/transcriptions/*.yaml', 'sources/commit-pins.tsv', 'scripts/fetch-sources.py') }}
      - name: Fetch pinned sources (commits by SHA; archived files on a cache miss)
        run: |
          pip install pyyaml
          sudo apt-get install -y -qq poppler-utils >/dev/null
          pdftotext -v 2>&1 | head -1
          python3 -I scripts/fetch-sources.py /tmp/src
      - run: scripts/verify.sh /tmp/src
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: verification/RLT-001-results.txt

  # RLT-003 M2: the GDT comparison, reported on its own with an explicit
  # status (compiled or unverified). It needs Mathlib and is outside the gate
  # above: Lean-checked statements about GDT are not RLT theorems.
  gdt-comparison:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/v4.2.4/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Clone GDT at the pinned commit
        run: |
          git clone -q https://github.com/thinkthoughts/general-divisor-theorem /tmp/gdt
          git -C /tmp/gdt checkout -q ec66260c98eff965bea79891ffbbc0d3229c6e93
      - name: GDT comparison (status line is compiled or unverified)
        shell: bash
        run: |
          set -o pipefail
          scripts/gdt-compare.sh /tmp/gdt | tee gdt-comparison.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gdt-comparison
          path: gdt-comparison.txt

  # RLT-007a (H3): the source-provenance check with no cache. Every GitHub
  # source is fetched by its pinned SHA from the live remote, the arXiv
  # e-print and the PDF are downloaded from their live URLs and refused unless
  # equal to their SHA-256 pins, and every excerpt is re-checked. A failure
  # here means a source moved or vanished; it says nothing about the proofs.
  # It is also the only writer of the source cache, and only on main: it
  # fetches into an empty directory (no cache restored), checks every
  # excerpt, and only then saves the directory for the gate to restore.
  source-provenance:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install pyyaml
          sudo apt-get install -y -qq poppler-utils >/dev/null
          python3 -I scripts/fetch-sources.py /tmp/src
          python3 -I scripts/check_excerpts.py /tmp/src
      - name: Save the pinned sources for the gate (main only)
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: /tmp/src
          key: rlt-sources-${{ hashFiles('sources/registry.yaml', 'sources/transcriptions/*.yaml', 'sources/commit-pins.tsv', 'scripts/fetch-sources.py') }}

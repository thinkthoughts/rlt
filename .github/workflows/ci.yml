name: rlt

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The Rust version comes from rust-toolchain.toml (pinned).
      - run: rustup show
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release
      - name: Install Lean (independent replay; lean/lean-toolchain selects the version)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/v4.2.4/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Clone source repositories for the excerpt check
        run: |
          pip install pyyaml
          mkdir -p /tmp/src
          for r in news rlt translatepi antiviolence residue-manifold-learning specification-grammar; do
            git clone -q "https://github.com/thinkthoughts/$r" "/tmp/src/$r"
          done
      - run: scripts/verify.sh /tmp/src
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: verification/RLT-001-results.txt

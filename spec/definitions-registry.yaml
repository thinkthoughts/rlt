# Registered definitions files (RLT-DEF-001a): trusted inputs to elaboration.
#
# A NAT-FUN proof or goal file may name only a definitions file listed here
# under kind `functions`, at exactly the listed SHA-256. Each function's
# content identity is the SHA-256 of its canonical text (format
# rlt-function-definition/1, see docs/RLT-DEF-001a-REPORT.md) and is listed
# under `defines`; one name has one content identity across this registry.
# The NAT-DEF entry is read-only: spec/definitions.rlt keeps its own loader
# and its pin PINNED_DEFINITIONS, which this entry must equal.

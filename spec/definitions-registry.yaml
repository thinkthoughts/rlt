# Changing this file requires changing PINNED_DEFINITION_FILES and
# PINNED_DEFINITIONS_REGISTRY_SHA in cli/src/defreg.rs, reviewed like kernel
# code. `rlt definitions` lists the registry and checks rules I1–I8.

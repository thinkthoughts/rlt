# Registered axiom sets (trusted inputs).
#
# A proof file names an axiom set by id, e.g. (axioms PEANO-ADD). The CLI
# loads only sets listed here, refuses a file whose SHA-256 differs from the
# value recorded below, and requires every axiom's (source …) to be the set's
# registered source. Changing an axiom therefore requires changing this file,
# which is reviewed like kernel code.

sets:
  - id: PEANO-ADD
    file: spec/peano.rlt
    sha256: 1a3f83444a06fdfbd02c9af2a5881b47137ba102a675a4e012c84be477b10a0d
    source: PEANO
    axioms: [add_zero, add_succ]
  - id: PEANO-ARITH
    file: spec/peano-arith.rlt
    sha256: 00ceffa9a60b53286f350edbf2f1a5f48a14169a9b09a82cbedc6f9956ff01e4
    source: OLP-ROBINSON-Q
    axioms: [add_zero, add_succ, mul_zero, mul_succ]
  - id: ROBINSON-Q
    file: spec/robinson-q.rlt
    sha256: 4ad55192222576e3901abc4ee7ea5a6760b64ff212e8c55796ab9847e423b00c
    source: OLP-ROBINSON-Q
    axioms: [q1_succ_inj, q2_zero_ne_succ, q3_zero_or_succ, add_zero, add_succ, mul_zero, mul_succ]

# Registered definitions (RLT-003 M3b): abbreviations expanded before the
# kernel, read only by proof files whose convention is NAT-DEF.
definitions:
  file: spec/definitions.rlt
  sha256: 122e37fc627b136023a1a5ffac0344162ed77ae95312248a9f6a76c2b639ecda

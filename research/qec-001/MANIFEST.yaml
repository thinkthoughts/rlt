evidence_levels:
  R: independent computational reproduction
  V: independent certificate verification
  K: kernel-checked mathematical proof (RLT)
  ordering: "R < V < K"
  lean_result: "K (Lean), reported, pending O-6; outside the RLT ordering; enters RLT results as a correspondence only"
completeness_bases:
  reviewed_argument: "written argument, reviewed and recorded; completeness executed by a reproducing program is level R"
  completeness_certificate: "finite data from which a small independent checker derives |T| <= |L| or T subset of L; the only basis for completeness at level V"
composition_rule: "weakest obligation: level = minimum of component levels; open obligations = union; pending while any is open or any relied-on argument is unreviewed"
acceptance_criterion: "mask-set equality under the registered encoding; counts and weight distributions are diagnostics only"
enumeration_procedure: [restrict to translation representatives (optional), close under all 45 translations, deduplicate by mask, recheck cycle condition and weight; meet-in-the-middle matches rebuilt, rechecked and deduplicated]

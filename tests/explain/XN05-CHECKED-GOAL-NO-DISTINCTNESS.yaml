    - "Divisors and common divisors are restricted to positive numbers because Q cannot refute 0 dividing 8 without induction; over the natural numbers this changes nothing (Lean mem_divisors, cop_iff_gcd)."
    - "Only the first claim of the excerpt is covered; nor is any subsequent multiple of 4 quantifies over all n and is outside this target."

  matches:
    - "Partners in 1..4, pairwise distinct, each coprime to its divisor (cop: every positive common divisor is 1) are, over the natural numbers, exactly a coprime matching between D(8) and 1..tau(8) in the paper's sense (Lean explicit_iff, matchable'_eight_iff; the direction of the matching is immaterial, matchable_iff)."
    - "The divisor set and the partner set are proved inside the theorem (matchable.divisors.8, matchable.partners.4), not assumed."
    - "The proof follows the paper's argument: the partners of the even divisors 2, 4 and 8 lie in 1 or 3 (matchable.odd_partner.2/4/8), and three distinct values cannot (matchable.pigeonhole.1_3)."
  differs:

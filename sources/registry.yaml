  - id: OLP-ROBINSON-Q
    title: "Open Logic Project, Incompleteness: Introduction, Definitions — Robinson's Q, axioms Q1–Q8 (CC BY 4.0)"
    location: https://github.com/OpenLogicProject/OpenLogic/blob/1e960beff9ed7835bf3e3f1335e21af3439cd107/content/incompleteness/introduction/definitions.tex
    commit: 1e960beff9ed7835bf3e3f1335e21af3439cd107
    status: available
    note: "Read 2026-11-08. RLT-003 M1 (decision D3): Q4–Q7 are the four equations of PEANO-ARITH, symbol for symbol: (Q4) ∀x (x + 0) = x; (Q5) ∀x ∀y (x + y′) = (x + y)′; (Q6) ∀x (x × 0) = 0; (Q7) ∀x ∀y (x × y′) = ((x × y) + x). RLT-003 M3b (decisions D1, D3, D5, D10): ROBINSON-Q states Q1–Q7 with the source's numbering and orientation, (Q1) ∀x ∀y (x′ = y′ → x = y); (Q2) ∀x ¬ 0 = x′; (Q3) ∀x (x = 0 ∨ ∃y x = y′); Q8's right-hand side ∃z (z′ + x) = y is the definition lt (x < y)."
    excerpts:
      - '\lforall[x][\lforall[y][(\eq[x''][y''] \lif \eq[x][y])]] \tag{$!Q_1$}'
      - '\lforall[x][\eq/[\Obj 0][x'']] \tag{$!Q_2$}'
      - '\lforall[x][(\eq[x][\Obj 0] \lor \lexists[y][\eq[x][y'']])] \tag{$!Q_3$}'
      - '\lforall[x][\eq[(x + \Obj 0)][x]] \tag{$!Q_4$}'
      - '\lforall[x][\lforall[y][\eq[(x + y'')][(x + y)'']]] \tag{$!Q_5$}'
      - '\lforall[x][\eq[(x \times \Obj 0)][\Obj 0]] \tag{$!Q_6$}'
      - '\lforall[x][\lforall[y][\eq[(x \times y'')][((x \times y) + x)]]] \tag{$!Q_7$}'
      - '\lforall[x][\lforall[y][(x < y \liff \lexists[z][\eq[(z'' + x)][y]])]] \tag{$!Q_8$}'


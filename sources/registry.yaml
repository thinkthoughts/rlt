# RLT source registry (component A).
#
# Each source has an id, a location, the commit or date it was read at, a
# status, and verbatim excerpts copied from the file at that commit.
#
# status:
#   available     file at a recorded commit; excerpts are checked against it by
#                 scripts/check_excerpts.py (an available source must have
#                 a GitHub file location and excerpts)
#   reference     cited literature or a repository referenced as a whole, with no
#                 excerpts; it can ground an axiom set, never a reading-point meaning
#   conversation  a statement made in the RLT review conversation, quoted verbatim;
#                 it has no file to check against
#   ambiguous     referenced, not verified at a commit; it cannot document a meaning
#   missing       known to exist or be needed, not available; it cannot document a meaning
#
# An excerpt is a string (context only) or {text, defines, split}:
#   defines   the reading point this excerpt documents
#   split     units (default): block tags delimit units, inline tags (a, strong,
#             em, b, i, code, sup) are transparent; whole: the excerpt is one unit
# `rlt validate` requires (1) every meaning and example of a reading point to
# equal a whole unit of an excerpt, from its cited source, tagged for that
# reading point, and (2) every unit of every tagged excerpt to appear in the
# reading point's record. A source is an input to interpretation; a source
# never proves a statement.


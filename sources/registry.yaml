    location: RLT-000 review conversation, 2026-11-07
    status: available
    excerpts:
      - "math0: Pairing (1+1) with imagination."
      - "math5: Pairing through 5 to 6."
      - "math29: Pairing through 29 to 30."
      - "These are names for mathematical reading points, not conventional educational reading-grade scores."

  - id: RLT-000-REFINEMENT
    title: RLT-000 final specification refinement and approval
    location: RLT-000 review conversation, 2026-11-07
    status: available
    excerpts:
      - "Treat imagination as physically situated human behavior without treating imagined objects as physically established."
      - "Keep `imagined` separate from mathematical validity and physical evidence status. An imagined expression may be represented and examined without its physical referent being established."
      - "A theorem may be reported as unconditional only when its assumption context is empty."


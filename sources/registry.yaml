# RLT source registry (component A).
#
# Each source has an id, a location, the commit or date it was read at, a
# status (available | missing | ambiguous), and verbatim excerpts copied from
# the file at that commit. Reading-point meanings and examples must appear
# inside an excerpt of the source they cite (`rlt validate` checks this).
# A source is an input to interpretation; a source never proves a statement.


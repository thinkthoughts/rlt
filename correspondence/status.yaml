# Shared status vocabulary for physical correspondence (E), reading points (F)
# and PiπΠ lifts (G). Correspondence values follow RML correspondence.yaml
# (status_values) plus `imagined` (approved in RLT-000 §9 item 4).

# `evidence-submitted` is RLT-authored (RLT-002 remediation approval): evidence
# is recorded and linked to its claim, and its evaluation stays with a reviewer.
# Records may hold unestablished, evidence-submitted, inapplicable or imagined
# (fixed in the binary as RECORDABLE_STATUS); `supported` and `rejected` are
# RML establishment judgments, kept here as source terms and refused in records.
correspondence_status: [unestablished, evidence-submitted, supported, rejected, inapplicable, imagined]

# Statuses a record may hold with an empty evidence list.
status_without_evidence: [unestablished, inapplicable, imagined]

# `imagined` describes an imagined object; it applies to referent records.
# The act of imagining is a behavior record with its own status.
referent_only_status: [imagined]

# Evidence types that can support a physical claim (RML allowed_support).
# Kernel theorems, shared readings and numerical coincidences are absent here.
allowed_support: [physical_measurement, experimentally_grounded_observation]

lift_status: [proposed, specified, verified]
